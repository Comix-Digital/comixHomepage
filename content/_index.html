<div class="customHome">
    <canvas id="myCanvas" width="500" height="500"></canvas>
    <a class="aButton" href="https://comix-digital.github.io/comixDigitalSite/" style="box-shadow: 0 0px">
        <img src="/images/mainblack.png" alt="Comix Digital logo." width="4096" height="4096" class="CDLogo" style="margin: 0 0">
    </a>
    <div id="pixelCloudDiv">
        <img src="/images/pixelCloud.png" alt="Pixelated cloud." width="300" height="169" id="ogPixelCloud" class="pixelCloud">
    </div>
    <span id="bgChangeCircle"></span>
</div>

<img src="/images/oneGreen.svg" alt="Green one." width="20" height="20" id="greenOne" style="display: none">
<img src="/images/zeroGreen.svg" alt="Green zero." width="20" height="20" id="greenZero" style="display: none">
<img src="/images/oneDarkGreen.svg" alt="Dark green one." width="20" height="20" id="darkGreenOne" style="display: none">
<img src="/images/zeroDarkGreen.svg" alt="Dark green zero." width="20" height="20" id="darkGreenZero" style="display: none">

<script>
    let bgChangeCircle = document.getElementById("bgChangeCircle")
    let CDLogo = document.querySelector(".CDLogo")
    let aButton = document.querySelector(".aButton")
    let pixelCloudDiv = document.querySelector("#pixelCloudDiv")
    let ogPixelCloud = document.querySelector("#ogPixelCloud")
    let animationPlayed = false;
    let tl = gsap.timeline();
    const root = document.querySelector(':root');
    const expandPixels = [124, 84, 67, 57, 50, 46, 44, 42, 30];
    const delay = ms => new Promise(res => setTimeout(res, ms));
    const greenOne = document.getElementById("greenOne");
    const greenZero = document.getElementById("greenZero");
    const darkGreenOne = document.getElementById("darkGreenOne");
    const darkGreenZero = document.getElementById("darkGreenZero");
    var c = document.getElementById("myCanvas");
    var ctx = c.getContext("2d");
    ctx.canvas.width = window.innerWidth;
    ctx.canvas.height = window.innerWidth;

    function generateCirclePixels(x, y, r, color) {
        var i;
        var angle;
        var x1;
        var y1;
        var pixelXPositions = [];
        var pixelYPositions = [];
        
        ctx.fillStyle = color;

        for(i = 0; i < 360; i += 1)
        {
            angle = i;
            x1 = r * Math.cos(angle * Math.PI / 180);
            y1 = r * Math.sin(angle * Math.PI / 180);
            if (Math.random() < 0.25) {
                ctx.drawImage(darkGreenOne, x + (Math.round(x1) * 20), y + (Math.round(y1) * 20), 20, 20);
            }else if (Math.random() < 0.5) {
                ctx.drawImage(darkGreenZero, x + (Math.round(x1) * 20), y + (Math.round(y1) * 20), 20, 20);
            }
            else if (Math.random() < 0.75) {
                ctx.drawImage(greenOne, x + (Math.round(x1) * 20), y + (Math.round(y1) * 20), 20, 20);
            }else{
                ctx.drawImage(greenZero, x + (Math.round(x1) * 20), y + (Math.round(y1) * 20), 20, 20);
            }
        }
    }

    async function animateCirclePixels() {
        const pixelCloud = document.getElementById("ogPixelCloud");
        for(i = 0; i < 10; i += 1) {
            generateCirclePixels(Math.ceil(window.innerWidth / 2), Math.ceil(window.innerWidth / 2), Math.ceil(window.innerWidth / expandPixels[i]), "DarkGreen");
            generateCirclePixels(Math.ceil(window.innerWidth / 2), Math.ceil(window.innerWidth / 2), (Math.ceil(window.innerWidth / expandPixels[i])) - 1, "green");
            generateCirclePixels(Math.ceil(window.innerWidth / 2), Math.ceil(window.innerWidth / 2), (Math.ceil(window.innerWidth / expandPixels[i])) + 1, "green");
            await delay(100);
            ctx.clearRect(0, 0, c.width, c.height);
        }
        console.log("Done");
        pixelCloudDiv.style.clipPath = "unset";
        return 0;
    }

    async function pixelCloudAnimation(){
        var initPixelCloud = document.createElement("img");
        initPixelCloud = ogPixelCloud.cloneNode(true);
        pixelCloudDiv.appendChild(initPixelCloud);
        initPixelCloud.id = "";
        initPixelCloud.style.top = `${Math.floor(Math.random() * (-50 - 20 + 1) + -50)}px`;
        initPixelCloud.style.left = "20vw";
        let initPxTl = gsap.timeline();
        initPxTl.to(initPixelCloud, {
            left: "100vw",
            duration: 10,
            ease: "none",
            onComplete: () => initPixelCloud.remove()
        })
        window.setInterval(function () {
            var pixelCloud = document.createElement("img");
            pixelCloud = ogPixelCloud.cloneNode(true);
            pixelCloudDiv.appendChild(pixelCloud);
            pixelCloud.id = "";
            pixelCloud.style.top = `${Math.floor(Math.random() * (-50 - 20 + 1) + -50)}px`;
            let pxTl = gsap.timeline();
            pxTl.to(pixelCloud, {
                left: "100vw",
                duration: 15,
                ease: "none",
                onComplete: () => pixelCloud.remove()
            })
        }, 4500)
    }

    aButton.addEventListener("mouseenter", function () {
        if (!animationPlayed) {
            animateCirclePixels();
            pixelCloudAnimation();
            bgChangeCircle.style.display = "block";
            tl.to(bgChangeCircle, {
                width: "80vmax",
                height: "80vmax",
                ease: "none",
                duration: 0.5,
            });
            tl.to(bgChangeCircle, {
                width: "99vw",
                height: "110vh",
                "border-radius": "0%",
                ease: "none",
                duration: 0.5,
            });
            tl.to(pixelCloudDiv, {
                clipPath: "circle(40vmax)",
                ease: "none",
                duration: 0.5,
            }, 0);
            tl.to(pixelCloudDiv, {
                clipPath: "circle(50vw)",
                ease: "none",
                duration: 0.5,
            }, 0.5);
            tl.to(root, {
                "--theme": "rgb(0, 0, 0)",
                duration: 0,
            });
            tl.to(bgChangeCircle, {
                display: "none",
                duration: 0,
            }, 3);
            animationPlayed = true;
        }
    })
</script>
