<div class="customHome">
    <canvas id="myCanvas" width="500" height="500"></canvas>
    <a class="aButton" href="https://comix-digital.github.io/comixDigitalSite/" style="box-shadow: 0 0px">
        <img src="/comixHomepage/images/mainblack.png" alt="Comix Digital logo." width="4096" height="4096" class="CDLogo" style="margin: 0 0">
    </a>
    <span id="bgChangeCircle"></span>
</div>

<img src="/comixHomepage/images/oneGreen.svg" alt="Green one." width="20" height="20" id="greenOne" style="display: none">
<img src="/comixHomepage/images/zeroGreen.svg" alt="Green zero." width="20" height="20" id="greenZero" style="display: none">
<img src="/comixHomepage/images/oneDarkGreen.svg" alt="Dark green one." width="20" height="20" id="darkGreenOne" style="display: none">
<img src="/comixHomepage/images/zeroDarkGreen.svg" alt="Dark green zero." width="20" height="20" id="darkGreenZero" style="display: none">

<script>
    let bgChangeCircle = document.getElementById("bgChangeCircle")
    let CDLogo = document.querySelector(".CDLogo")
    let aButton = document.querySelector(".aButton")
    let animationPlayed = false;
    let tl = gsap.timeline();
    const root = document.querySelector(':root');
    const expandPixels = [124, 84, 67, 57, 50, 46, 44, 42, 30];
    const delay = ms => new Promise(res => setTimeout(res, ms));
    const greenOne = document.getElementById("greenOne");
    const greenZero = document.getElementById("greenZero");
    const darkGreenOne = document.getElementById("darkGreenOne");
    const darkGreenZero = document.getElementById("darkGreenZero");
    var c = document.getElementById("myCanvas");
    var ctx = c.getContext("2d");
    ctx.canvas.width = window.innerWidth;
    ctx.canvas.height = window.innerWidth;

    function generateCirclePixels(x, y, r, color) {
        var i;
        var angle;
        var x1;
        var y1;
        var pixelXPositions = [];
        var pixelYPositions = [];
        
        ctx.fillStyle = color;

        for(i = 0; i < 360; i += 1)
        {
            angle = i;
            x1 = r * Math.cos(angle * Math.PI / 180);
            y1 = r * Math.sin(angle * Math.PI / 180);
            if (Math.random() < 0.25) {
                ctx.drawImage(darkGreenOne, x + (Math.round(x1) * 20), y + (Math.round(y1) * 20), 20, 20);
            }else if (Math.random() < 0.5) {
                ctx.drawImage(darkGreenZero, x + (Math.round(x1) * 20), y + (Math.round(y1) * 20), 20, 20);
            }
            else if (Math.random() < 0.75) {
                ctx.drawImage(greenOne, x + (Math.round(x1) * 20), y + (Math.round(y1) * 20), 20, 20);
            }else{
                ctx.drawImage(greenZero, x + (Math.round(x1) * 20), y + (Math.round(y1) * 20), 20, 20);
            }
        }
    }

    async function animateCirclePixels() {
        for(i = 0; i < 10; i += 1) {
            generateCirclePixels(Math.ceil(window.innerWidth / 2), Math.ceil(window.innerWidth / 2), Math.ceil(window.innerWidth / expandPixels[i]), "DarkGreen");
            generateCirclePixels(Math.ceil(window.innerWidth / 2), Math.ceil(window.innerWidth / 2), (Math.ceil(window.innerWidth / expandPixels[i])) - 1, "green");
            generateCirclePixels(Math.ceil(window.innerWidth / 2), Math.ceil(window.innerWidth / 2), (Math.ceil(window.innerWidth / expandPixels[i])) + 1, "green");
            await delay(100);
            ctx.clearRect(0, 0, c.width, c.height);
        }
        tl.pause();
        console.log("Done");
        return 0;
    }

    aButton.addEventListener("mouseenter", function () {
        if (!animationPlayed) {
            animateCirclePixels();
            bgChangeCircle.style.display = "block";
            tl.to(bgChangeCircle, {
                width: "80vmax",
                height: "80vmax",
                ease: "none",
                duration: 0.5,
            });
            tl.to(bgChangeCircle, {
                width: "99vw",
                height: "110vh",
                "border-radius": "0%",
                ease: "none",
                duration: 0.5,
            });
            tl.to(root, {
                "--theme": "rgb(0, 0, 0)",
                duration: 0,
            });
            tl.to(bgChangeCircle, {
                display: "none",
                duration: 0,
            }, 3);
            animationPlayed = true;
        }
    })
</script>
